[package]
name = "terminal-tool-finder"
version = "0.1.10"
edition = "2024"
description = "Terminal Tool Finder — fuzzy search terminal commands from tools.json"
license = "MIT"
repository = "https://github.com/ysoftman/ttf"

[[bin]]
name = "ttf"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
